<!-- MathJax v3：渲染行内/块级 LaTeX 公式 -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)'], ['$', '$']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      tags: 'none'
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
      enableMenu: false
    },
    chtml: { scale: 1.0 }
  };
</script>
<!-- 优先加载站点自带的 MathJax（同源，保证可获取）；失败则回退到多个 CDN -->
